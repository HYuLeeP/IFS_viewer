name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Test installer with macOS Zsh PATH setup
        if: runner.os == 'macOS'
        env:
          TEST_HOME: ${{ runner.temp }}/ifs-viewer-home
        run: |
          mkdir -p "$TEST_HOME"
          HOME="$TEST_HOME" \
          XDG_DATA_HOME="$TEST_HOME/.local/share" \
          XDG_BIN_HOME="$TEST_HOME/.local/bin" \
          PYTHON_BIN=python3 \
          ./install.sh
          test -x "$TEST_HOME/.local/bin/ifs-viewer"
          test -x "$TEST_HOME/.local/bin/ifs_viewer"
          grep -q "IFS_viewer PATH" "$TEST_HOME/.zshrc"
          "$TEST_HOME/.local/bin/ifs-viewer" --help
          HOME="$TEST_HOME" \
          XDG_DATA_HOME="$TEST_HOME/.local/share" \
          XDG_BIN_HOME="$TEST_HOME/.local/bin" \
          ./install.sh --uninstall

      - name: Check JavaScript syntax
        run: node --check src/ifs_viewer/static/app.js

      - name: Run tests
        run: python -m pytest -q
